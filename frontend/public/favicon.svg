<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Badge with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Depth -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Modern Geometric 'BY' Monogram -->
  <g filter="url(#glow)">
    <!-- Letter 'B' -->
    <path d="M16 17 H27 C31.5 17 34 19 34 22 C34 24.2 32.5 26 30 26.8 C33 27.5 35 29.8 35 33 C35 37 32 40 27 40 H16 Z M22 22 V27 H26 C28 27 29 26.2 29 24.5 C29 22.8 28 22 26 22 Z M22 30 V35 H27 C29 35 30 34.2 30 32.5 C30 30.8 29 30 27 30 Z" fill="#E5E7EB"/>

    <!-- Letter 'Y' in Vibrant Emerald -->
    <path d="M36 17 L42 27 V40 H47 V27 L53 17 H47.5 L44.5 23 L41.5 17 Z" fill="#10B981"/>
  </g>

  <!-- Accent Status Node (Top Right) -->
  <circle cx="51" cy="13" r="3" fill="#10B981"/>
  <circle cx="51" cy="13" r="1.5" fill="#FFFFFF"/>
</svg>

